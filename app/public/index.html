<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storyviz</title>
<link rel="stylesheet" href="/style.css">
<script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js"}}</script>
</head>
<body>
<header>
  <span class="dot" aria-hidden="true"></span>
  <input id="name" class="name" spellcheck="false" maxlength="80" placeholder="Untitled" aria-label="Project name" title="Rename this project">
  <div class="menu-wrap">
    <button class="quiet" id="typeBtn" title="Change the writing type"></button>
    <div class="menu" id="typeMenu" hidden></div>
  </div>
  <button class="save" id="saveBtn" title="Save now (⌘S)"></button>
  <span class="grow"></span>
  <button class="quiet" id="openBtn" title="Open a project (⌘O)">Open</button>
  <button class="solid" id="newBtn">New</button>
</header>

<main>
  <section class="editor">
    <div class="pad">
      <div class="backdrop" id="backdrop" aria-hidden="true"></div>
      <textarea id="text" spellcheck="false" placeholder="Start writing. A blank line starts a new scene."></textarea>
      <button class="sample" id="sampleBtn" hidden>or load a sample</button>
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="stage-wrap">
    <div id="stage"></div>
    <div class="phone" id="phone" hidden>
      <div class="phone-top"><span id="beat"></span><span id="sec"></span></div>
      <div class="phone-caption" id="caption"></div>
    </div>
    <div class="overlay top-left"><div class="title" id="title"></div></div>
    <button class="overlay top-right hud" id="hud" hidden><b id="hudBig"></b><span id="hudSmall"></span></button>
    <div class="overlay bottom">
      <div class="tools">
        <div class="menu-wrap">
          <button id="styleBtn" title="Pick a visual style"></button>
          <div class="menu up" id="styleMenu" hidden></div>
        </div>
        <label class="sw" title="Switch to a new visual style every 7 seconds"><input type="checkbox" id="restyleSw"><i></i>Restyle</label>
        <label class="sw" title="Keep redrawing each scene with more detail, setting and background, up to four passes"><input type="checkbox" id="improveSw"><i></i>Keep improving</label>
        <label class="sw" title="On: the model imagines whatever the text leaves out. Off: only what you wrote is drawn, and anything vague shows as a pale ghost or a ? box."><input type="checkbox" id="fillSw"><i></i>Fill gaps</label>
        <button id="redrawBtn" title="Draw this scene again">Redraw</button>
      </div>
      <div class="pages" id="pages"></div>
    </div>
  </section>

  <aside class="coach">
    <div class="coach-head">
      <h2>Coach</h2>
      <span class="coach-status" id="coachStatus"></span>
      <button class="mini" id="reviewBtn" hidden>Review</button>
      <label class="sw" title="Review the draft every time you pause typing"><input type="checkbox" id="liveSw"><i></i>Auto review</label>
    </div>
    <div class="verdict" id="verdict" hidden></div>
    <div class="scores" id="scores" hidden></div>
    <nav class="tabs" id="tabs">
      <button data-tab="tips">Tips<i id="tipsCount"></i></button>
      <button data-tab="structure">Structure<i id="stagesCount"></i></button>
      <button data-tab="ideas">Ideas<i id="ideasCount"></i></button>
      <button data-tab="research">Research<i id="researchCount"></i></button>
    </nav>
    <div class="pane" data-pane="tips">
      <p class="empty" id="tipsEmpty"></p>
      <div id="tips"></div>
      <button class="more" id="moreTips" hidden></button>
      <div id="goodWrap" hidden><h3>Working well</h3><div id="good"></div></div>
    </div>
    <div class="pane" data-pane="structure" hidden>
      <h3 id="structureName"></h3>
      <div class="stages" id="stages"></div>
    </div>
    <div class="pane" data-pane="ideas" hidden>
      <p class="empty" id="ideasEmpty">Ideas show up after a review.</p>
      <div id="detailsWrap" hidden><h3>Facts you could use</h3><div id="details"></div></div>
      <div id="asksWrap" hidden><h3>Answer this</h3><div id="asks"></div></div>
      <div id="nextWrap" hidden><h3>Add a next line</h3><div id="next"></div></div>
    </div>
    <div class="pane" data-pane="research" hidden>
      <form class="ask" id="askForm">
        <textarea id="askText" class="field" rows="2" maxlength="400" spellcheck="false" placeholder="Send the coach to look something up, e.g. how much water AI actually uses"></textarea>
        <button class="solid" id="askBtn" disabled>Research</button>
      </form>
      <div id="research"></div>
    </div>
    <button class="rules-link" id="rulesBtn"></button>
  </aside>
</main>

<dialog id="projectsDlg">
  <div class="dlg-head"><h2>Projects</h2><button class="x" data-close aria-label="Close">×</button></div>
  <h3>New project</h3>
  <input id="newName" class="field" maxlength="80" placeholder="Name (optional)" spellcheck="false">
  <div class="types" id="newTypes"></div>
  <h3 id="projListHead">Open a project</h3>
  <div class="list" id="projList"></div>
</dialog>

<dialog id="rulesDlg">
  <div class="dlg-head"><h2 id="rulesTitle">Guides</h2><button class="x" data-close aria-label="Close">×</button></div>
  <div class="rules" id="rules"></div>
</dialog>

<script type="module" src="/main.js"></script>
</body>
</html>
